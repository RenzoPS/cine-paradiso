
{% extends 'base.html' %}

{% block title %}Iniciar sesión - Cine Paradiso{% endblock %}

{% block content %}
<section class="auth-container">
    <div class="card auth-card">
        <h1>Iniciar sesión</h1>
        <p>Ingresá a tu cuenta para continuar.</p>

        <form method="POST">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="120"
                    required
                >
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Iniciar sesión
            </button>
        </form>

        <p>
            ¿Todavía no tenés una cuenta?
            <a href="{{ url_for('auth.registro') }}">Registrate</a>
        </p>
    </div>
</section>
{% endblock %}
