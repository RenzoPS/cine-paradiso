
{% extends 'base.html' %}

{% block title %}Crear cuenta - Cine Paradiso{% endblock %}

{% block content %}
<section class="auth-container">
    <div class="card auth-card">
        <h1>Crear una cuenta</h1>
        <p>Completá tus datos para registrarte en Cine Paradiso.</p>

        <form method="POST">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    maxlength="80"
                    required
                >
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    maxlength="80"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="120"
                    required
                >
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    minlength="8"
                    maxlength="128"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Registrarme
            </button>
        </form>
    </div>
</section>
{% endblock %}
