services:
  db:
    image: mysql:8
    container_name: cine-paradiso-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./api/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./api
    container_name: cine-paradiso-api
    restart: unless-stopped
    environment:
      # Adentro de la red de compose la base se llama "db" y escucha en el 3306.
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-cine_paradiso}
      API_SECRET_KEY: ${API_SECRET_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # El QR apunta al web tal como se ve desde el navegador.
      WEB_URL: http://localhost:${WEB_PORT:-5001}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      # Espera a que MySQL acepte conexiones, no solo a que el contenedor exista.
      db:
        condition: service_healthy

  web:
    build: ./web
    container_name: cine-paradiso-web
    restart: unless-stopped
    environment:
      # Adentro de la red de compose la API se llama "api".
      API_URL: http://api:5000/cine_paradiso_api
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:-solo-para-desarrollo}
    ports:
      - "${WEB_PORT:-5001}:5001"
    depends_on:
      - api

volumes:
  mysql_data:
